[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
files = [
  "run.py",
  "pinnstorch/contracts.py",
  "pinnstorch/checkpoint_contract.py",
  "pinnstorch/api.py",
  "pinnstorch/runner",
  "pinnstorch/models/pinn_module.py",
  "pinnstorch/data/pinn_datamodule.py",
  "pinnstorch/data/domains/point_cloud.py",
  "pinnstorch/data/mesh/mesh.py",
  "pinnstorch/data/sampler/sampler_base.py",
  "pinnstorch/data/sampler/initial_condition.py",
  "pinnstorch/data/sampler/mesh_sampler.py",
  "pinnstorch/data/sampler/explicit_boundary.py",
  "pinnstorch/data/dataloader/dataloader.py",
  "pinnstorch/models/net/neural_net.py",
  "pinnstorch/utils/module_fn.py",
  "pinnstorch/utils/pylogger.py",
]

[tool.pytest.ini_options]
addopts = [
  "-q",
  "--color=auto",
  "--tb=short",
  "--strict-markers",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = false
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = ["tests/runner", "tests/numerics", "tests/integration"]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
