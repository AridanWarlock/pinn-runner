[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
files = [
  "run.py",
  "pinnstorch/contracts.py",
  "pinnstorch/checkpoint_contract.py",
  "pinnstorch/config_validation.py",
  "pinnstorch/parameter_functions.py",
  "pinnstorch/data/domains/point_cloud.py",
  "pinnstorch/data/domains/time.py",
  "pinnstorch/data/dataloader/dataloader.py",
  "pinnstorch/models/net/neural_net.py",
  "pinnstorch/utils/module_fn.py",
  "pinnstorch/utils/pylogger.py",
]

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = ["tests/runner", "tests/numerics", "tests/integration"]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
