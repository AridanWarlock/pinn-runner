[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
files = [
  "run.py",
  "scripts/check_backend.py",
  "scripts/gpu_jobs.py",
  "scripts/gpu_worker.py",
  "scripts/benchmark_solutions.py",
  "scripts/benchmark_robin_balance.py",
  "scripts/benchmark_robin_execution.py",
  "scripts/benchmark_robin_lifting.py",
  "scripts/benchmark_backward.py",
  "scripts/benchmark_time_to_quality.py",
  "scripts/benchmark_cosine_spectrum.py",
  "scripts/benchmark_modal_diagnostics.py",
  "scripts/benchmark_modal_balance.py",
  "scripts/benchmark_residual_slices.py",
  "scripts/benchmark_hard_execution.py",
  "scripts/benchmark_hard_derivatives.py",
  "benchmarks",
  "tests/hardware",
  "pinnstorch/contracts.py",
  "pinnstorch/checkpoint_contract.py",
  "pinnstorch/api.py",
  "pinnstorch/coefficients.py",
  "pinnstorch/runner",
  "pinnstorch/training",
  "pinnstorch/models/pinn_module.py",
  "pinnstorch/data/pinn_datamodule.py",
  "pinnstorch/data/domains/point_cloud.py",
  "pinnstorch/data/mesh/mesh.py",
  "pinnstorch/data/sampler/sampler_base.py",
  "pinnstorch/data/sampler/initial_condition.py",
  "pinnstorch/data/sampler/mesh_sampler.py",
  "pinnstorch/data/sampler/explicit_boundary.py",
  "pinnstorch/data/dataloader/dataloader.py",
  "pinnstorch/models/net/neural_net.py",
  "pinnstorch/utils/module_fn.py",
  "pinnstorch/utils/pylogger.py",
]

[tool.pytest.ini_options]
addopts = [
  "-q",
  "--color=auto",
  "--tb=short",
  "--strict-markers",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = false
markers = [
  "slow: slow tests",
  "e2e: file-based runner tests that launch training/prediction subprocesses",
]
minversion = "6.0"
testpaths = ["tests/runner", "tests/numerics", "tests/integration"]

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]
